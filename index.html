            position: sticky;

        }

            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .progress-bar {
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            height: 24px;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            box-sizing: border-box;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
        }
        th {
            background-color: #0a9396;
            color: white;
            font-weight: 600;
        }
        .checkbox-cell { text-align: center; width: 80px; }
        .disciplina-header td {
            background-color: #e9d8a6;
            color: #001219;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
        }
        .topico-principal { font-weight: 600; color: #222; }
        .subtopico { padding-left: 40px !important; color: #555; font-size: 0.95rem; }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #0a9396;
        }
        tr:hover { background-color: #f8f9fa; }

            .header-top { flex-direction: column; align-items: flex-start; gap: 15px; }
            .stats-grid { grid-template-columns: 1fr; gap: 10px; }
            th, td { padding: 10px 5px; font-size: 0.9rem; }

                    "1.6 Records in Contexts – RiC.",
                    "1.7 RiC-FAD, RiC-CM e RiC-O.",
                    "1.8 Representação de agentes, funções, atividades, eventos e relações.",
                    "1.9 Ontologias arquivísticas, Linked Data e grafos de conhecimento.",
                    "1.10 EAD e intercâmbio de descrições arquivísticas.",
                    "2 Preservação física e digital.",
                    "2.1 Conservação preventiva e preservação de suportes analógicos.",
                    "2.2 Agentes de deterioração e gestão de riscos.",
                    "2.3 Digitalização e representantes digitais.",
                    "2.4 Obsolescência tecnológica.",
                    "2.5 Formatos de preservação.",
                    "2.6 Migração, normalização, emulação e encapsulamento.",
                    "2.7 Fixidez, checksums e verificação de integridade.",
                    "2.8 Modelo OAIS.",
                    "2.9 PREMIS.",
                    "2.10 Pacotes de informação e fluxos de preservação.",
                    "2.11 Repositório Arquivístico Digital Confiável – RDC-Arq.",
                    "2.12 Archivematica, AtoM e soluções equivalentes: arquitetura e funcionalidades.",
                    "2.13 Preservação de websites e mídias sociais.",
                    "2.14 Preservação de documentos audiovisuais, iconográficos e sonoros.",
                    "2.15 Catalogação de acervos de TV e Rádio.",
                    "3 Arquivos permanentes, memória e patrimônio documental.",
                    "3.1 Gestão de arquivos permanentes.",
                    "3.2 Patrimônio documental.",
                    "3.3 Pesquisa histórica e fontes primárias.",
                    "3.4 Curadoria arquivística.",
                    "3.5 Difusão cultural e educativa.",
                    "3.6 Exposições físicas e digitais.",
                    "3.7 História oral e narrativas digitais.",
                    "3.8 Acessibilidade e inclusão.",
                    "3.9 Memória institucional plural e representativa."
                ]
            }
        ];

        // Atualização da chave para v4 (Garante que os dados novos não deem conflito com a matriz antiga)
        let savedData = JSON.parse(localStorage.getItem('cd2026_progress_arq_v4')) || {};

        function renderTable() {
            let html = `<table>
                <tr>
                    <th>Conteúdo Programático</th>
                    <th class="checkbox-cell">Teoria</th>
                    <th class="checkbox-cell">Questões</th>
                    <th class="checkbox-cell">Revisão</th>
                </tr>`;
            
            edital.forEach((disc, dIndex) => {
                html += `<tr class="disciplina-header"><td colspan="4">${disc.disciplina}</td></tr>`;
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    const chkTeoria = savedData[`${idBase}-t`] ? 'checked' : '';
                    const chkQuest = savedData[`${idBase}-q`] ? 'checked' : '';
                    const chkRev = savedData[`${idBase}-r`] ? 'checked' : '';
                    
                    const isSubtopico = /^\d+\.\d+/.test(topico);
                    const classTopico = isSubtopico ? 'subtopico' : 'topico-principal';

                    html += `<tr>
                        <td class="${classTopico}">${topico}</td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-t', this.checked)" ${chkTeoria}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-q', this.checked)" ${chkQuest}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-r', this.checked)" ${chkRev}></td>
                    </tr>`;
                });
            });
            html += `</table>`;
            document.getElementById('tabela-container').innerHTML = html;
            calculateProgress();
        }

        function updateProgress(id, isChecked) {
            savedData[id] = isChecked;
            localStorage.setItem('cd2026_progress_arq_v4', JSON.stringify(savedData));
            calculateProgress();
        }

        function calculateProgress() {
            let total = 0, theoryDone = 0, questDone = 0, revDone = 0;
            let theoryTotal = 0, questTotal = 0, revTotal = 0;

            edital.forEach((disc, dIndex) => {
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    total += 3; theoryTotal++; questTotal++; revTotal++;
                    if(savedData[`${idBase}-t`]) theoryDone++;
                    if(savedData[`${idBase}-q`]) questDone++;
                    if(savedData[`${idBase}-r`]) revDone++;
                });
            });

            const geralDone = theoryDone + questDone + revDone;
            
            document.getElementById('geral-fill').style.width = (total === 0 ? 0 : Math.round((geralDone/total)*100)) + '%';
            document.getElementById('geral-text').innerText = (total === 0 ? 0 : Math.round((geralDone/total)*100)) + '%';
            
            document.getElementById('teoria-fill').style.width = (theoryTotal === 0 ? 0 : Math.round((theoryDone/theoryTotal)*100)) + '%';
            document.getElementById('teoria-text').innerText = (theoryTotal === 0 ? 0 : Math.round((theoryDone/theoryTotal)*100)) + '%';
            
            document.getElementById('questoes-fill').style.width = (questTotal === 0 ? 0 : Math.round((questDone/questTotal)*100)) + '%';
            document.getElementById('questoes-text').innerText = (questTotal === 0 ? 0 : Math.round((questDone/questTotal)*100)) + '%';
            
            document.getElementById('revisao-fill').style.width = (revTotal === 0 ? 0 : Math.round((revDone/revTotal)*100)) + '%';
            document.getElementById('revisao-text').innerText = (revTotal === 0 ? 0 : Math.round((revDone/revTotal)*100)) + '%';
        }

        // Funções de Sincronização
        function exportarProgresso() {
            const data = localStorage.getItem('cd2026_progress_arq_v4');
            if(!data || data === "{}") {
                alert("Você ainda não marcou nenhum progresso para exportar.");
                return;
            }
            navigator.clipboard.writeText(data).then(() => {
                alert("CÓDIGO COPIADO!\nCole este código em um bloco de notas ou envie para você mesmo no WhatsApp. No outro aparelho, clique em 'Importar' e cole esse código.");
            }).catch(err => {
                prompt("O navegador bloqueou a cópia automática. Copie o código abaixo manualmente:", data);
            });
        }

        function importarProgresso() {
            const input = prompt("Cole o código de progresso que você gerou no seu outro aparelho:");
            if (input) {
                try {
                    const parsed = JSON.parse(input);
                    if (typeof parsed === 'object') {
                        localStorage.setItem('cd2026_progress_arq_v4', input);
                        savedData = parsed;
                        renderTable();
                        alert("Progresso importado e atualizado com sucesso!");
                    }
                } catch (e) {
                    alert("Código inválido. Certifique-se de copiar o texto inteiro gerado no outro aparelho.");
                }
            }
        }

        renderTable();
    </script>
</body>
