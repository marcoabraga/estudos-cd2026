<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CD 2026 - Arquivologia</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #005f73;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .dashboard {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 10px;
        }
        .progress-section {
            margin-bottom: 15px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .progress-bar {
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            height: 24px;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            box-sizing: border-box;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
        }
        th {
            background-color: #0a9396;
            color: white;
            font-weight: 600;
        }
        .checkbox-cell {
            text-align: center;
            width: 80px;
        }
        .disciplina-header td {
            background-color: #e9d8a6;
            color: #001219;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
        }
        .topico-principal {
            font-weight: 600;
            color: #222;
        }
        .subtopico {
            padding-left: 40px !important;
            color: #555;
            font-size: 0.95rem;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #0a9396;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .disciplina-header:hover {
            background-color: #e9d8a6;
        }
    </style>
</head>
<body>

            <div class="progress-section">
                <div class="progress-label">
                    <span>Progresso Global do Edital</span>
                    <span id="geral-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="geral-fill" class="progress-fill" style="background-color: #005f73;"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="progress-section">
                    <div class="progress-label">
                        <span>📖 Teoria</span>
                        <span id="teoria-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="teoria-fill" class="progress-fill" style="background-color: #0a9396;"></div>
                    </div>
                </div>
                
                <div class="progress-section">
                    <div class="progress-label">
                        <span>📝 Questões</span>
                        <span id="questoes-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="questoes-fill" class="progress-fill" style="background-color: #ee9b00;"></div>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-label">
                        <span>🔄 Revisão</span>
                        <span id="revisao-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="revisao-fill" class="progress-fill" style="background-color: #ae2012;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container" id="tabela-container">
            <!-- Tabela injetada via JavaScript -->
        </div>
    </div>

        // Carregar dados salvos no navegador (Nova versão para não conflitar com a antiga)
        let savedData = JSON.parse(localStorage.getItem('cd2026_progress_arq_v2')) || {};

        function renderTable() {
            let html = `<table>
                <tr>
                    <th>Conteúdo Programático</th>
                    <th class="checkbox-cell">Teoria</th>
                    <th class="checkbox-cell">Questões</th>
                    <th class="checkbox-cell">Revisão</th>
                </tr>`;
            
            edital.forEach((disc, dIndex) => {
                html += `<tr class="disciplina-header"><td colspan="4">${disc.disciplina}</td></tr>`;
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    const chkTeoria = savedData[`${idBase}-t`] ? 'checked' : '';
                    const chkQuest = savedData[`${idBase}-q`] ? 'checked' : '';
                    const chkRev = savedData[`${idBase}-r`] ? 'checked' : '';
                    
                    // Verifica se o tópico começa com um formato de subtópico (ex: "4.1.")
                    const isSubtopico = /^\d+\.\d+/.test(topico);
                    const classTopico = isSubtopico ? 'subtopico' : 'topico-principal';

                    html += `<tr>
                        <td class="${classTopico}">${topico}</td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-t', this.checked)" ${chkTeoria}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-q', this.checked)" ${chkQuest}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-r', this.checked)" ${chkRev}></td>
                    </tr>`;
                });
            });
            html += `</table>`;
            document.getElementById('tabela-container').innerHTML = html;
            calculateProgress();
        }

        function updateProgress(id, isChecked) {
            savedData[id] = isChecked;
            localStorage.setItem('cd2026_progress_arq_v2', JSON.stringify(savedData));
            calculateProgress();
        }

        function calculateProgress() {
            let total = 0, theoryTotal = 0, questTotal = 0, revTotal = 0;
            let theoryDone = 0, questDone = 0, revDone = 0;

            edital.forEach((disc, dIndex) => {
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    total += 3;
                    theoryTotal++; questTotal++; revTotal++;
                    
                    if(savedData[`${idBase}-t`]) theoryDone++;
                    if(savedData[`${idBase}-q`]) questDone++;
                    if(savedData[`${idBase}-r`]) revDone++;
                });
            });

            const geralDone = theoryDone + questDone + revDone;
            
            const percGeral = total === 0 ? 0 : Math.round((geralDone / total) * 100);
            document.getElementById('geral-fill').style.width = percGeral + '%';
            document.getElementById('geral-text').innerText = percGeral + '%';

            const percTeoria = theoryTotal === 0 ? 0 : Math.round((theoryDone / theoryTotal) * 100);
            document.getElementById('teoria-fill').style.width = percTeoria + '%';
            document.getElementById('teoria-text').innerText = percTeoria + '%';

            const percQuest = questTotal === 0 ? 0 : Math.round((questDone / questTotal) * 100);
            document.getElementById('questoes-fill').style.width = percQuest + '%';
            document.getElementById('questoes-text').innerText = percQuest + '%';

            const percRev = revTotal === 0 ? 0 : Math.round((revDone / revTotal) * 100);
            document.getElementById('revisao-fill').style.width = percRev + '%';
            document.getElementById('revisao-text').innerText = percRev + '%';
        }

        renderTable();
    </script>
</body>
</html>
