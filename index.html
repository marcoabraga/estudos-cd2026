<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CD 2026 - Arquivologia - Marco Braga</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #005f73;
            margin: 0;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #666;
            margin-top: 5px;
            margin-bottom: 0;
        }
        .sync-buttons button {
            background-color: #0a9396;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            font-size: 0.9rem;
        }
        .sync-buttons button.export { background-color: #005f73; }
        .sync-buttons button:hover { opacity: 0.9; }
        .dashboard {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dashboard h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 10px;
        }
        .progress-section {
            margin-bottom: 15px;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .progress-bar {
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            height: 24px;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            box-sizing: border-box;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
        }
        th {
            background-color: #0a9396;
            color: white;
            font-weight: 600;
        }
        .checkbox-cell { text-align: center; width: 80px; }
        .disciplina-header td {
            background-color: #e9d8a6;
            color: #001219;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
        }
        .topico-principal { font-weight: 600; color: #222; }
        .subtopico { padding-left: 40px !important; color: #555; font-size: 0.95rem; }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #0a9396;
        }
        tr:hover { background-color: #f8f9fa; }
        
        /* Ajustes para celulares (iPhone) */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; gap: 15px; }
            .stats-grid { grid-template-columns: 1fr; gap: 10px; }
            th, td { padding: 10px 5px; font-size: 0.9rem; }
            .subtopico { padding-left: 15px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <div>
                <h1>Edital Verticalizado</h1>
                <p class="subtitle">CD 2026 - Arquivologia</p>
            </div>
            <div class="sync-buttons">
                <button class="export" onclick="exportarProgresso()">📤 Exportar Progresso</button>
                <button onclick="importarProgresso()">📥 Importar</button>
            </div>
        </div>

        <div class="dashboard">
            <h2>📊 Dashboard de Desempenho</h2>
            <div class="progress-section">
                <div class="progress-label">
                    <span>Progresso Global do Edital</span>
                    <span id="geral-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="geral-fill" class="progress-fill" style="background-color: #005f73;"></div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="progress-section">
                    <div class="progress-label"><span>📖 Teoria</span><span id="teoria-text">0%</span></div>
                    <div class="progress-bar"><div id="teoria-fill" class="progress-fill" style="background-color: #0a9396;"></div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-label"><span>📝 Questões</span><span id="questoes-text">0%</span></div>
                    <div class="progress-bar"><div id="questoes-fill" class="progress-fill" style="background-color: #ee9b00;"></div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-label"><span>🔄 Revisão</span><span id="revisao-text">0%</span></div>
                    <div class="progress-bar"><div id="revisao-fill" class="progress-fill" style="background-color: #ae2012;"></div></div>
                </div>
            </div>
        </div>

        <div class="table-container" id="tabela-container"></div>
    </div>

    <script>

            },
            {
                disciplina: "Conhecimentos Específicos - Teoria e Gestão Arquivística",

                    "3.4. Captura em sistemas corporativos.",
                    "3.5. SIGAD.",
                    "3.6. GED, ECM, SIGAD: diferenças e integração.",

                    "3.9. Trilhas de auditoria.",

                    "4.1. Constituição de 1988 (acesso à informação).",
                    "4.2. Lei nº 8.159/1991.",
                    "4.3. Legislação do SINAR e CONARQ.",
                    "4.4. Normas internas da Câmara dos Deputados.",
                    "4.5. Assinaturas eletrônicas.",
                    "4.6. Digitalização.",

                ]

        ];

        let savedData = JSON.parse(localStorage.getItem('cd2026_progress_arq_v3')) || {};

        function renderTable() {
            let html = `<table>
                <tr>
                    <th>Conteúdo Programático</th>
                    <th class="checkbox-cell">Teoria</th>
                    <th class="checkbox-cell">Questões</th>
                    <th class="checkbox-cell">Revisão</th>
                </tr>`;
            
            edital.forEach((disc, dIndex) => {
                html += `<tr class="disciplina-header"><td colspan="4">${disc.disciplina}</td></tr>`;
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    const chkTeoria = savedData[`${idBase}-t`] ? 'checked' : '';
                    const chkQuest = savedData[`${idBase}-q`] ? 'checked' : '';
                    const chkRev = savedData[`${idBase}-r`] ? 'checked' : '';
                    
                    const isSubtopico = /^\d+\.\d+/.test(topico);
                    const classTopico = isSubtopico ? 'subtopico' : 'topico-principal';

                    html += `<tr>
                        <td class="${classTopico}">${topico}</td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-t', this.checked)" ${chkTeoria}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-q', this.checked)" ${chkQuest}></td>
                        <td class="checkbox-cell"><input type="checkbox" onchange="updateProgress('${idBase}-r', this.checked)" ${chkRev}></td>
                    </tr>`;
                });
            });
            html += `</table>`;
            document.getElementById('tabela-container').innerHTML = html;
            calculateProgress();
        }

        function updateProgress(id, isChecked) {
            savedData[id] = isChecked;
            localStorage.setItem('cd2026_progress_arq_v3', JSON.stringify(savedData));
            calculateProgress();
        }

        function calculateProgress() {
            let total = 0, theoryDone = 0, questDone = 0, revDone = 0;
            let theoryTotal = 0, questTotal = 0, revTotal = 0;

            edital.forEach((disc, dIndex) => {
                disc.topicos.forEach((topico, tIndex) => {
                    const idBase = `${dIndex}-${tIndex}`;
                    total += 3; theoryTotal++; questTotal++; revTotal++;
                    if(savedData[`${idBase}-t`]) theoryDone++;
                    if(savedData[`${idBase}-q`]) questDone++;
                    if(savedData[`${idBase}-r`]) revDone++;
                });
            });

            const geralDone = theoryDone + questDone + revDone;
            
            document.getElementById('geral-fill').style.width = (total === 0 ? 0 : Math.round((geralDone/total)*100)) + '%';
            document.getElementById('geral-text').innerText = (total === 0 ? 0 : Math.round((geralDone/total)*100)) + '%';
            
            document.getElementById('teoria-fill').style.width = (theoryTotal === 0 ? 0 : Math.round((theoryDone/theoryTotal)*100)) + '%';
            document.getElementById('teoria-text').innerText = (theoryTotal === 0 ? 0 : Math.round((theoryDone/theoryTotal)*100)) + '%';
            
            document.getElementById('questoes-fill').style.width = (questTotal === 0 ? 0 : Math.round((questDone/questTotal)*100)) + '%';
            document.getElementById('questoes-text').innerText = (questTotal === 0 ? 0 : Math.round((questDone/questTotal)*100)) + '%';
            
            document.getElementById('revisao-fill').style.width = (revTotal === 0 ? 0 : Math.round((revDone/revTotal)*100)) + '%';
            document.getElementById('revisao-text').innerText = (revTotal === 0 ? 0 : Math.round((revDone/revTotal)*100)) + '%';
        }

        // Funções de Sincronização
        function exportarProgresso() {
            const data = localStorage.getItem('cd2026_progress_arq_v3');
            if(!data || data === "{}") {
                alert("Você ainda não marcou nenhum progresso para exportar.");
                return;
            }
            // Tenta copiar direto para a área de transferência
            navigator.clipboard.writeText(data).then(() => {
                alert("CÓDIGO COPIADO!\nCole este código em um bloco de notas ou envie para você mesmo no WhatsApp. No outro aparelho, clique em 'Importar' e cole esse código.");
            }).catch(err => {
                // Fallback caso o navegador bloqueie a cópia automática
                const fallback = prompt("O navegador bloqueou a cópia automática. Copie o código abaixo manualmente:", data);
            });
        }

        function importarProgresso() {
            const input = prompt("Cole o código de progresso que você gerou no seu outro aparelho:");
            if (input) {
                try {
                    const parsed = JSON.parse(input);
                    if (typeof parsed === 'object') {
                        localStorage.setItem('cd2026_progress_arq_v3', input);
                        savedData = parsed;
                        renderTable();
                        alert("Progresso importado e atualizado com sucesso!");
                    }
                } catch (e) {
                    alert("Código inválido. Certifique-se de copiar o texto inteiro gerado no outro aparelho.");
                }
            }
        }

        renderTable();
    </script>
</body>
</html>
